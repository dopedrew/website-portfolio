<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="soc-lab-isolation-title soc-lab-isolation-desc">
        <title id="soc-lab-isolation-title">SOC detection lab network isolation</title>
        <desc id="soc-lab-isolation-desc">Five lab VMs sit on a Proxmox bridge with no physical NIC, so packages reach them through a single outbound NAT rule on the host while unsolicited traffic from the internet and the production LAN stops at the boundary.</desc>
        <defs>
          <marker id="soc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#685e54"/></marker>
          <marker id="soc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a592b"/></marker>
          <marker id="soc-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3d5a80"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f6f3ee"/>

        <!-- ZONE: the isolated lab (security treatment, drawn before arrows and nodes) -->
        <rect x="48" y="328" width="864" height="168" rx="8" fill="rgba(122,89,43,0.05)" stroke="rgba(122,89,43,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="96" y="332" width="208" height="12" rx="2" fill="#f6f3ee"/>
        <text x="200" y="341" fill="#706459" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ISOLATED LAB · NO PHYSICAL NIC</text>

        <!-- ARROWS (before boxes) -->
        <!-- the vmbr99 rail -->
        <line x1="96" y1="376" x2="864" y2="376" stroke="#685e54" stroke-width="1.2"/>
        <!-- each VM drops onto the rail -->
        <line x1="136" y1="408" x2="136" y2="376" stroke="#685e54" stroke-width="1"/>
        <line x1="308" y1="408" x2="308" y2="376" stroke="#685e54" stroke-width="1"/>
        <line x1="480" y1="408" x2="480" y2="376" stroke="#685e54" stroke-width="1"/>
        <line x1="652" y1="408" x2="652" y2="376" stroke="#685e54" stroke-width="1"/>
        <line x1="824" y1="408" x2="824" y2="376" stroke="#685e54" stroke-width="1"/>
        <!-- permitted: lab egress up to the host, then out -->
        <line x1="480" y1="376" x2="480" y2="264" stroke="#685e54" stroke-width="1.2" marker-end="url(#soc-arrow)"/>
        <path d="M 336,232 H 312 Q 304,232 304,224 V 108 Q 304,100 296,100 H 272" fill="none" stroke="#685e54" stroke-width="1.2" marker-end="url(#soc-arrow)"/>

        <!-- forbidden: both stop short of the boundary, with a stop bar and no arrowhead -->
        <line x1="184" y1="128" x2="184" y2="308" stroke="#7a592b" stroke-width="1.4" stroke-dasharray="5,4"/>
        <line x1="170" y1="308" x2="198" y2="308" stroke="#7a592b" stroke-width="2.5"/>
        <line x1="776" y1="128" x2="776" y2="308" stroke="#7a592b" stroke-width="1.4" stroke-dasharray="5,4"/>
        <line x1="762" y1="308" x2="790" y2="308" stroke="#7a592b" stroke-width="2.5"/>

        <!-- ARROW LABELS -->
        <rect x="490" y="306" width="56" height="12" rx="2" fill="#f6f3ee"/>
        <text x="518" y="315" fill="#706459" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NAT OUT</text>

        <rect x="314" y="152" width="72" height="12" rx="2" fill="#f6f3ee"/>
        <text x="350" y="161" fill="#706459" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OUTBOUND ONLY</text>

        <rect x="194" y="206" width="64" height="12" rx="2" fill="#f6f3ee"/>
        <text x="226" y="215" fill="#7a592b" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO INBOUND</text>

        <rect x="786" y="206" width="64" height="12" rx="2" fill="#f6f3ee"/>
        <text x="818" y="215" fill="#7a592b" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO L2 PATH</text>

        <!-- rail label, above the rail with a gap -->
        <rect x="728" y="356" width="136" height="12" rx="2" fill="#f6f3ee"/>
        <text x="796" y="365" fill="#685e54" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">vmbr99 · 10.99.99.1/24</text>

        <!-- NODES -->
        <!-- external -->
        <rect x="96" y="72" width="176" height="56" rx="6" fill="#f6f3ee"/>
        <rect x="96" y="72" width="176" height="56" rx="6" fill="rgba(29,26,21,0.03)" stroke="rgba(29,26,21,0.30)" stroke-width="1"/>
        <text x="184" y="98" fill="#1d1a15" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Internet</text>
        <text x="184" y="114" fill="#685e54" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">packages · updates</text>

        <rect x="688" y="72" width="176" height="56" rx="6" fill="#f6f3ee"/>
        <rect x="688" y="72" width="176" height="56" rx="6" fill="rgba(29,26,21,0.03)" stroke="rgba(29,26,21,0.30)" stroke-width="1"/>
        <text x="776" y="98" fill="#1d1a15" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Production LAN</text>
        <text x="776" y="114" fill="#685e54" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10.10.0.0/24 · vmbr0</text>

        <!-- the privileged gate -->
        <rect x="336" y="200" width="288" height="64" rx="6" fill="#f6f3ee"/>
        <rect x="336" y="200" width="288" height="64" rx="6" fill="#ffffff" stroke="#1d1a15" stroke-width="1.4"/>
        <text x="480" y="228" fill="#1d1a15" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Proxmox host</text>
        <text x="480" y="246" fill="#685e54" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">MASQUERADE 10.99.99.0/24 → vmbr0</text>

        <!-- lab endpoints -->
        <rect x="64" y="408" width="144" height="56" rx="6" fill="#f6f3ee"/>
        <rect x="64" y="408" width="144" height="56" rx="6" fill="rgba(104,94,84,0.10)" stroke="#706459" stroke-width="1"/>
        <text x="136" y="434" fill="#1d1a15" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Wazuh SIEM</text>
        <text x="136" y="450" fill="#685e54" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">soc-siem</text>

        <rect x="236" y="408" width="144" height="56" rx="6" fill="#f6f3ee"/>
        <rect x="236" y="408" width="144" height="56" rx="6" fill="rgba(104,94,84,0.10)" stroke="#706459" stroke-width="1"/>
        <text x="308" y="434" fill="#1d1a15" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Linux target</text>
        <text x="308" y="450" fill="#685e54" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">soc-victim</text>

        <rect x="408" y="408" width="144" height="56" rx="6" fill="#f6f3ee"/>
        <rect x="408" y="408" width="144" height="56" rx="6" fill="rgba(104,94,84,0.10)" stroke="#706459" stroke-width="1"/>
        <text x="480" y="434" fill="#1d1a15" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Attacker box</text>
        <text x="480" y="450" fill="#685e54" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">soc-attacker</text>

        <rect x="580" y="408" width="144" height="56" rx="6" fill="#f6f3ee"/>
        <rect x="580" y="408" width="144" height="56" rx="6" fill="rgba(104,94,84,0.10)" stroke="#706459" stroke-width="1"/>
        <text x="652" y="434" fill="#1d1a15" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Windows server</text>
        <text x="652" y="450" fill="#685e54" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">soc-dc01</text>

        <rect x="752" y="408" width="144" height="56" rx="6" fill="#f6f3ee"/>
        <rect x="752" y="408" width="144" height="56" rx="6" fill="rgba(104,94,84,0.10)" stroke="#706459" stroke-width="1"/>
        <text x="824" y="434" fill="#1d1a15" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Windows client</text>
        <text x="824" y="450" fill="#685e54" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">soc-win11</text>

        <!-- LEGEND -->
        <line x1="48" y1="544" x2="912" y2="544" stroke="rgba(29,26,21,0.10)" stroke-width="0.8"/>
        <text x="48" y="564" fill="#685e54" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <line x1="152" y1="560" x2="184" y2="560" stroke="#685e54" stroke-width="1.2" marker-end="url(#soc-arrow)"/>
        <text x="196" y="564" fill="#685e54" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">PERMITTED</text>

        <line x1="332" y1="560" x2="356" y2="560" stroke="#7a592b" stroke-width="1.4" stroke-dasharray="5,4"/>
        <line x1="356" y1="552" x2="356" y2="568" stroke="#7a592b" stroke-width="2.5"/>
        <text x="368" y="564" fill="#685e54" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">STOPS AT THE BOUNDARY</text>

        <rect x="608" y="552" width="24" height="12" rx="3" fill="rgba(122,89,43,0.05)" stroke="rgba(122,89,43,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="644" y="564" fill="#685e54" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">ISOLATED ZONE</text>

        <rect x="800" y="552" width="16" height="10" rx="2" fill="rgba(104,94,84,0.10)" stroke="#706459" stroke-width="1"/>
        <text x="824" y="564" fill="#685e54" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.06em">LAB VM</text>
      </svg>
